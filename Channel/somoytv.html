<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JW Player</title>

  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>

  <style>
    html,body{
      margin:0;
      background:#000;
      width:100%;
      height:100%;
    }
    #player{
      width:100%;
      height:100vh;
    }
  </style>
</head>
<body>

<div id="player"></div>

<script>
jwplayer("player").setup({
    file: "https://live.thebosstv.com:30443/dwlive/Somoy-TV/playlist.m3u8",
    width: "100%",
    aspectratio: "16:9",
    autostart: true,
    mute: true,
    stretching: "uniform",
    primary: "html5"
});
</script>

</body>
</html>
